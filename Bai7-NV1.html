<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhiệm vụ 1 - Bài 7</title>
</head>
<body>
    <h2>ĐĂNG KÝ THÔNG TIN</h2>
    <form action="#" method="post">
        <!-- Họ và tên (text) -->
        <label for="name">Họ và tên:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <!-- Giới tính (radio) -->
        <label>Giới tính:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Nam</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Nữ</label><br><br>

        <!-- Sở thích (checkbox) -->
        <label>Sở thích:</label><br>
        <input type="checkbox" id="music" name="hobby" value="music">
        <label for="music">Âm nhạc</label>
        <input type="checkbox" id="sports" name="hobby" value="sports">
        <label for="sports">Thể thao</label><br><br>

        <!-- Lớp (select) -->
        <label for="class">Lớp:</label>
        <select id="class" name="class">
            <option value="12a1">12A1</option>
            <option value="12a2">12A2</option>
        </select><br><br>

        <!-- Ghi chú (textarea) -->
        <label for="note">Ghi chú:</label><br>
        <textarea id="note" name="note" rows="4" cols="30"></textarea><br><br>

        <!-- Nút gửi (button) -->
        <button type="submit">Gửi</button>
        <button type="reset">Xóa</button>
    </form>
</body>
</html>
